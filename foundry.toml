[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
remappings = ['forge-std/=lib/forge-std/src/']
solc = '0.8.20'
fs_permissions = [
  { access = 'read', path = './test/data' },
  { access = 'read', path = './proposal' },
  { access = 'read-write', path = './proposal/generated' },
]
# A rate limited mainnet archive endpoint, shared by everyone who runs this, so that forge and cast work without an RPC
# account. `--rpc-url <url>` on any command, or FOUNDRY_ETH_RPC_URL for a whole session, overrides it.
eth_rpc_url = "https://lb.drpc.live/ethereum/Ap8y607N-kWQqs4ydkzcCwJx0S4NsO8R8YB0Mrvp6PLd"
